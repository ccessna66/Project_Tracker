<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#223142">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Traveler — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #edf0f2;
    --paper-line: #c7d0d6;
    --card: #fffefb;
    --ink: #223142;
    --ink-dim: #5b6b7a;
    --copper: #bf6a35;
    --copper-dim: #e0b391;
    --solder: #4c7a63;
    --amber: #c99a3a;
    --danger: #a4463a;
    --shadow: 0 1px 2px rgba(34,49,66,0.06), 0 4px 14px rgba(34,49,66,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 36px 28px 80px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .title-block h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .title-block .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    margin-top: 4px;
  }

  .stats {
    display: flex;
    gap: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .stats .num {
    display: block;
    font-size: 20px;
    color: var(--ink);
    font-weight: 600;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin: 22px 0 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  button { font-family: 'IBM Plex Sans', sans-serif; cursor: pointer; border: none; }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 3px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    box-shadow: var(--shadow);
  }
  .btn-primary:hover { background: #1a2431; }

  select.filter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 9px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
  }

  .io-row {
    display: flex;
    gap: 10px;
    margin: -10px 0 22px;
  }
  .io-btn {
    background: none;
    border: 1px solid var(--paper-line);
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 11px;
    border-radius: 3px;
  }
  .io-btn:hover { border-color: var(--ink-dim); color: var(--ink); }

  .hide-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
  }
  .hide-toggle input { cursor: pointer; }

  .legend {
    display: flex;
    gap: 14px;
    margin-left: auto;
    flex-wrap: wrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    align-items: center;
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .add-type-btn {
    background: none;
    border: 1px dashed var(--paper-line);
    border-radius: 3px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
  }
  .add-type-btn:hover { border-color: var(--ink-dim); color: var(--ink); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-head { padding: 16px 18px 12px; border-bottom: 1px dashed var(--paper-line); position: relative; }

  .drag-handle {
    position: absolute;
    top: 14px;
    right: 16px;
    cursor: grab;
    color: #c3cbd1;
    font-size: 14px;
    letter-spacing: 2px;
    user-select: none;
    padding: 2px 4px;
  }
  .drag-handle:hover { color: var(--ink-dim); }
  .drag-handle:active { cursor: grabbing; }

  .card.dragging { opacity: 0.4; }
  .card.drop-target { outline: 2px dashed var(--copper); outline-offset: -2px; }

  .tag-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--copper);
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 4px 0 6px;
    word-break: break-word;
    outline: none;
  }

  .card-notes {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.4;
    margin: 0 0 10px;
    min-height: 18px;
    outline: none;
  }
  .card-notes:empty:before { content: "Add a note..."; color: #a3b0ba; }

  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .status-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 100px;
    font-weight: 600;
    cursor: pointer;
  }
  .status-not-started { background: #e3e7ea; color: var(--ink-dim); }
  .status-in-progress { background: #f3e2d1; color: var(--copper); }
  .status-blocked { background: #f0ded2; color: var(--danger); }
  .status-done { background: #dce9e2; color: var(--solder); }

  .del-btn { background: none; color: #b7c0c8; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .del-btn:hover { color: var(--danger); }

  .pads { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 18px; }
  .pad { width: 14px; height: 14px; border-radius: 2px; border: 1.5px solid var(--copper-dim); background: transparent; cursor: pointer; }
  .pad.empty-slot { visibility: hidden; }

  .steps { padding: 2px 18px 14px; }

  .step-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid #f1f3f4;
  }
  .step-row:last-child { border-bottom: none; }

  .step-check {
    width: 16px; height: 16px; margin-top: 2px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 3px; background: var(--card);
    cursor: pointer; flex-shrink: 0; position: relative;
  }
  .step-check.checked { border-color: var(--ink); }
  .step-check.checked::after {
    content: ""; position: absolute; left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid white; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .step-check.locked { cursor: not-allowed; opacity: 0.45; background: repeating-linear-gradient(45deg, #f1f3f4, #f1f3f4 3px, #e3e7ea 3px, #e3e7ea 6px); }
  .pad.locked { cursor: not-allowed; opacity: 0.4; }

  .step-body { flex: 1; min-width: 0; }
  .step-toprow { display: flex; align-items: center; gap: 8px; }

  .type-select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  .dep-btn {
    background: none;
    border: 1px solid var(--paper-line);
    color: var(--ink-dim);
    font-size: 11px;
    border-radius: 3px;
    padding: 2px 7px;
    flex-shrink: 0;
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
  }
  .dep-btn:hover { border-color: var(--ink-dim); color: var(--ink); }
  .dep-btn.has-deps { color: var(--copper); border-color: var(--copper-dim); }

  .lock-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--danger);
    margin-top: 3px;
  }

  .dep-popover {
    position: absolute;
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 10px;
    z-index: 100;
    min-width: 220px;
    max-width: 300px;
    max-height: 260px;
    overflow-y: auto;
  }
  .dep-popover .dep-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .dep-popover label {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-size: 12.5px;
    padding: 4px 0;
    cursor: pointer;
  }
  .dep-popover .dep-empty { font-size: 12.5px; color: var(--ink-dim); }
  .dep-popover .dep-close {
    margin-top: 8px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 5px 10px;
    font-size: 12px;
    width: 100%;
    font-weight: 600;
  }

  .step-text { flex: 1; font-size: 13.5px; line-height: 1.4; outline: none; }
  .step-text.done { color: var(--ink-dim); text-decoration: line-through; }

  .step-del { background: none; color: #c3cbd1; font-size: 13px; padding: 0 2px; flex-shrink: 0; }
  .step-del:hover { color: var(--danger); }

  .add-step { display: flex; gap: 8px; padding: 10px 18px 16px; flex-wrap: wrap; }
  .add-step input {
    flex: 1; min-width: 120px;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
    padding: 7px 10px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fafbfb;
  }
  .add-step input:focus { outline: 1.5px solid var(--copper-dim); }
  .add-step select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 0 8px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: #fafbfb;
    color: var(--ink);
  }
  .add-step button {
    background: var(--paper); border: 1px solid var(--paper-line); color: var(--ink);
    padding: 0 12px; border-radius: 3px; font-size: 12.5px; font-weight: 600;
  }
  .add-step button:hover { background: #e0e5e8; }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--ink-dim); }
  .empty-state h2 { font-family: 'Space Grotesk', sans-serif; color: var(--ink); font-size: 20px; margin-bottom: 8px; }

  .loading { text-align: center; padding: 60px; color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 9px 18px; border-radius: 3px;
    font-size: 13px; font-family: 'IBM Plex Mono', monospace;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  /* ---- view tabs, timer bar ---- */
  #projFilters { display: contents; }
  #projFilters.hidden { display: none; }

  .tabs { display: flex; gap: 4px; margin: 22px 0 0; border-bottom: 1px solid var(--paper-line); }
  .tabs button {
    background: none; padding: 9px 18px;
    font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600;
    color: var(--ink-dim); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--copper); }

  .timer-bar {
    display: none; align-items: center; gap: 12px;
    background: var(--ink); color: var(--paper);
    padding: 9px 14px; border-radius: 3px; margin-top: 16px;
    font-size: 13px; box-shadow: var(--shadow);
  }
  .timer-bar.on { display: flex; }
  .timer-bar .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--copper); animation: pulse 1.4s infinite; flex-shrink: 0; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .timer-bar .clock { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .timer-bar button { margin-left: auto; background: var(--copper); color: #fff; padding: 5px 12px; border-radius: 3px; font-weight: 600; font-size: 12px; }

  /* ---- project card additions ---- */
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
    padding: 10px 18px; border-bottom: 1px dashed var(--paper-line);
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-dim);
  }
  .stage-select {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em;
    text-transform: uppercase; font-weight: 600; padding: 3px 6px; border-radius: 3px; border: none; cursor: pointer;
  }
  .meta-field { display: flex; align-items: center; gap: 5px; }
  .meta-field.overdue { color: var(--danger); }
  .meta-field.overdue input { border-color: var(--danger); color: var(--danger); }
  .meta-field input[type=date], .due-field input[type=date] {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 2px 5px;
    border: 1px solid var(--paper-line); border-radius: 3px; background: #fafbfb; color: var(--ink);
  }
  button.chip, .chip {
    padding: 2px 8px; border-radius: 100px; background: var(--paper);
    border: 1px solid var(--paper-line); white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-dim);
  }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: var(--ink-dim); color: var(--ink); }
  .chip.warn { background: #f6ecd3; border-color: #e5cf93; color: #8a6420; }
  .details-btn {
    margin-left: auto; background: var(--paper); border: 1px solid var(--paper-line);
    color: var(--ink); padding: 4px 10px; border-radius: 3px; font-size: 12px; font-weight: 600;
  }
  .details-btn:hover { background: #e0e5e8; }

  .step-meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-dim);
  }
  .timer-btn {
    background: none; border: 1px solid var(--paper-line); color: var(--ink-dim);
    border-radius: 3px; padding: 1px 7px; font-size: 10.5px; font-family: 'IBM Plex Mono', monospace;
  }
  .timer-btn:hover { border-color: var(--ink-dim); color: var(--ink); }
  .timer-btn.running { background: var(--copper); border-color: var(--copper); color: #fff; }
  .step-time { cursor: pointer; }
  .step-time:hover { color: var(--ink); text-decoration: underline; }
  .due-field { display: flex; align-items: center; gap: 4px; }
  .due-field input[type=date] { font-size: 11px; padding: 1px 4px; }
  .due-field.overdue { color: var(--danger); }
  .due-field.overdue input { border-color: var(--danger); color: var(--danger); }
  .due-field.soon { color: #9a7424; }
  .due-field.soon input { border-color: #e5cf93; }

  /* ---- modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(34,49,66,0.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto; z-index: 200;
  }
  .modal {
    background: var(--card); border: 1px solid var(--paper-line); border-radius: 4px;
    box-shadow: 0 12px 40px rgba(34,49,66,0.3); width: min(980px, 100%);
  }
  .modal.narrow { width: min(560px, 100%); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px dashed var(--paper-line); gap: 12px; }
  .modal-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0; }
  .modal-x { background: none; font-size: 20px; color: var(--ink-dim); line-height: 1; padding: 2px 6px; }
  .modal-x:hover { color: var(--danger); }
  .modal-body { padding: 4px 22px 24px; }
  .modal-section { margin-top: 22px; }
  .modal-section h3 {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--copper); margin: 0 0 8px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .modal-section h3 .sum { color: var(--ink-dim); letter-spacing: 0; text-transform: none; font-weight: 500; }
  .sched-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .sched-row label { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-dim); }
  .sched-row input, .sched-row select, .add-row input, .add-row select {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; padding: 6px 8px;
    border: 1px solid var(--paper-line); border-radius: 3px; background: #fafbfb; color: var(--ink);
  }
  table.dt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dt th {
    text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-dim); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--paper-line);
  }
  table.dt th.num, table.dt td.num { text-align: right; }
  table.dt td { padding: 4px 6px; border-bottom: 1px solid #f1f3f4; vertical-align: middle; }
  table.dt tfoot td { font-weight: 600; border-top: 2px solid var(--paper-line); border-bottom: none; }
  table.dt td input, table.dt td select {
    width: 100%; font: inherit; font-size: 12.5px; padding: 4px 6px;
    border: 1px solid transparent; border-radius: 3px; background: transparent; color: var(--ink);
  }
  table.dt td input:hover, table.dt td select:hover { border-color: var(--paper-line); }
  table.dt td input:focus { outline: 1.5px solid var(--copper-dim); background: #fff; }
  table.dt td input[type=number] { text-align: right; }
  .add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .add-row button, .modal-primary {
    background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 3px; font-size: 12.5px; font-weight: 600;
  }
  .row-del { background: none; color: #b7c0c8; font-size: 14px; padding: 0 4px; }
  .row-del:hover { color: var(--danger); }
  .muted { color: var(--ink-dim); font-size: 12.5px; }
  .day-events { margin: 4px 0 14px; padding: 0; list-style: none; }
  .day-events li { padding: 6px 0; border-bottom: 1px solid #f1f3f4; font-size: 13px; cursor: pointer; }
  .day-events li:hover { color: var(--copper); }
  .form-grid { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; align-items: center; font-size: 13px; margin-bottom: 14px; }
  .form-grid select { width: 100%; font-family: inherit; font-size: 13px; padding: 7px 8px; border: 1px solid var(--paper-line); border-radius: 3px; background: #fafbfb; }

  /* ---- pipeline ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tile {
    background: var(--card); border: 1px solid var(--paper-line); border-radius: 4px; box-shadow: var(--shadow);
    padding: 14px 16px; border-top: 3px solid var(--tile-color, var(--copper));
  }
  .tile-num { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; }
  .tile-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin-top: 2px; }
  .tile-names { font-size: 12px; color: var(--ink-dim); margin-top: 8px; line-height: 1.45; }
  .tile-flag { font-size: 12px; color: var(--danger); font-weight: 600; margin-top: 6px; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 26px; align-items: start; }
  .col { background: rgba(255,254,251,0.65); border: 1px solid var(--paper-line); border-radius: 4px; padding: 10px; }
  .col-head {
    display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; padding-bottom: 8px;
    border-bottom: 2px solid var(--col-color); margin-bottom: 8px; color: var(--ink);
  }
  .col-empty { font-size: 12px; color: #a3b0ba; padding: 6px 2px; }
  .mini { background: var(--card); border: 1px solid var(--paper-line); border-radius: 3px; padding: 9px 10px; margin-bottom: 8px; box-shadow: var(--shadow); }

  .mini-actions { display: flex; gap: 6px; align-items: center; }

  .panel { background: var(--card); border: 1px solid var(--paper-line); border-radius: 4px; box-shadow: var(--shadow); padding: 14px 18px 16px; margin-bottom: 20px; }
  .panel h3 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h3 .sum { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-dim); font-weight: 500; }
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px; }
  .mini-btn { background: var(--paper); border: 1px solid var(--paper-line); color: var(--ink); padding: 3px 9px; border-radius: 3px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .mini-btn:hover { background: #e0e5e8; }
  .overdue-txt { color: var(--danger); font-weight: 600; }
  .link-btn { background: none; color: var(--ink); font-weight: 600; font-size: 13px; text-align: left; padding: 0; }
  .link-btn:hover { color: var(--copper); text-decoration: underline; }
  .panel table.dt td input[type=date] { width: auto; }

  /* ---- calendar ---- */
  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .cal-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 14px 0 4px; min-width: 190px; }
  .cal-btn { background: var(--card); border: 1px solid var(--paper-line); padding: 6px 12px; border-radius: 3px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .cal-btn:hover { background: #e9edf0; }
  .cal-key { margin-left: auto; display: flex; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-dim); }
  .cal-key span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-left: 3px solid var(--k); background: var(--kbg); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--paper-line); border-top: 1px solid var(--paper-line); background: var(--card); box-shadow: var(--shadow); margin-bottom: 24px; }
  .cal-dow { padding: 6px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); background: var(--paper); border-right: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); }
  .cal-day { min-height: 112px; padding: 5px 6px; border-right: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); cursor: pointer; min-width: 0; }
  .cal-day:hover { background: #faf7f2; }
  .cal-day.other { background: #f4f6f7; }
  .cal-day.other .cal-num { color: #a3b0ba; }
  .cal-num { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; display: inline-block; margin-bottom: 3px; }
  .cal-day.today .cal-num { background: var(--copper); color: #fff; border-radius: 100px; padding: 1px 7px; }
  .chip-ev {
    display: block; font-size: 11.5px; line-height: 1.3; padding: 2px 5px; border-radius: 2px; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
    border-left: 3px solid var(--ink); background: var(--paper);
  }
  .chip-ev.ev-ship { border-color: var(--copper); background: #f3e2d1; font-weight: 600; }
  .chip-ev.ev-eta { border-color: var(--amber); background: #f6ecd3; }
  .chip-ev.done { text-decoration: line-through; color: var(--ink-dim); border-color: #a3b0ba; background: #eef1f3; font-weight: 400; }
  .chip-ev.overdue { border-color: var(--danger); background: #f0ded2; color: var(--danger); }
  .ev-more { font-size: 11px; color: var(--ink-dim); }
  .up-kind { display: inline-block; min-width: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; }

  /* ---- sync controls ---- */
  .io-row { flex-wrap: wrap; }
  .io-btn.sync-btn.ok { color: var(--solder); border-color: #b9d3c6; }
  .io-btn.sync-btn.warn { color: var(--danger); border-color: #dcb3aa; background: #fbf1ee; }
  .io-btn.sync-btn.busy { color: var(--copper); border-color: var(--copper-dim); }
  .form-grid input {

  .top-btn {

  /* ---- phone layout ---- */

  @media (max-width: 640px) {
    body { padding: 16px 12px 70px; }

    .stats { gap: 6px 16px; flex-wrap: wrap; }
    .stats .num { font-size: 17px; }

    .tabs { overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { padding: 11px 14px; white-space: nowrap; font-size: 14px; }

    .toolbar { gap: 8px; margin: 14px 0 16px; }
    #projFilters { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; align-items: center; }
    #projFilters.hidden { display: none; }
    .legend { margin-left: 0; width: 100%; }
    .btn-primary { padding: 11px 16px; }
    select.filter { padding: 10px 10px; font-size: 14px; }
    .io-row { margin-top: 0; }
    .io-btn { padding: 9px 12px; font-size: 12px; }

    .timer-bar { flex-wrap: wrap; gap: 8px; }
    .timer-bar button { padding: 8px 14px; }

    /* cards */
    .card-head { padding: 14px 14px 10px; }
    .card-title { font-size: 17px; margin-right: 76px; }
    .drag-handle { display: none; }
    .top-btn { right: 14px; padding: 6px 12px; font-size: 12px; }

    .meta-field input[type=date], .due-field input[type=date] { font-size: 16px; padding: 5px 6px; }
    .stage-select { font-size: 12px; padding: 7px 8px; }
    button.chip, .chip { padding: 6px 11px; font-size: 12px; }
    .details-btn { padding: 8px 14px; }
    .pads { padding: 10px 14px; gap: 5px; }
    .pad { width: 20px; height: 20px; }
    .steps { padding: 2px 14px 12px; }
    .step-row { gap: 10px; padding: 10px 0; }
    .step-check { width: 24px; height: 24px; margin-top: 0; }
    .step-check.checked::after { left: 7px; top: 2px; width: 6px; height: 12px; }
    .step-toprow { flex-wrap: wrap; row-gap: 6px; }
    .step-text { order: 10; flex: 1 1 100%; font-size: 15px; padding: 2px 0; }
    .type-select { font-size: 11px; padding: 6px 8px; }
    .dep-btn { font-size: 12px; padding: 6px 10px; }
    .step-del { margin-left: auto; font-size: 16px; padding: 6px 10px; }
    .timer-btn { padding: 6px 12px; font-size: 12px; }
    .step-meta { gap: 8px 12px; font-size: 12px; }
    .add-step { padding: 10px 14px 14px; }
    .add-step input, .add-step select { font-size: 16px; padding: 9px 10px; }
    .add-step input { flex: 1 1 100%; order: 2; }
    .add-step button { padding: 9px 16px; order: 3; }
    .dep-popover { max-width: calc(100vw - 24px); }

    /* dialogs become full-screen sheets */
    .modal-backdrop { padding: 0; }
    .modal, .modal.narrow { width: 100%; min-height: 100%; border-radius: 0; border: none; }
    .modal-head { padding: 14px; position: sticky; top: 0; background: var(--card); z-index: 2; }
    .modal-head h2 { font-size: 17px; }
    .modal-x { font-size: 24px; padding: 4px 10px; }
    .modal-body { padding: 4px 14px 40px; }
    .sched-row input, .sched-row select, .add-row input, .add-row select, .form-grid input, .form-grid select { font-size: 16px; padding: 9px 10px; }
    .add-row { gap: 8px; }
    .add-row input[style], .add-row select[style] { width: 100% !important; max-width: none !important; flex: 1 1 100%; }
    .add-row button, .modal-primary { padding: 11px 18px; }
    .form-grid { grid-template-columns: 1fr; gap: 4px; }
    .form-grid label { margin-top: 6px; }

    /* the editable tables turn into one card per row */
    .modal table.dt, .modal table.dt tbody, .modal table.dt tr, .modal table.dt td, table.dt.stack, table.dt.stack tbody, table.dt.stack tr, table.dt.stack td { display: block; width: auto !important; }
    .modal table.dt thead, table.dt.stack thead { display: none; }
    .modal table.dt tr, table.dt.stack tr { position: relative; border: 1px solid var(--paper-line); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
    .modal table.dt td, table.dt.stack td { border: none; padding: 4px 0; }
    .modal table.dt td[data-label]::before, table.dt.stack td[data-label]::before {
      content: attr(data-label); display: block; font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 2px;
    }
    .modal table.dt td.num, table.dt.stack td.num { text-align: left; }
    .modal table.dt td input, .modal table.dt td select, table.dt.stack td input, table.dt.stack td select { font-size: 16px; padding: 9px 10px; border-color: var(--paper-line); background: #fafbfb; }
    .modal table.dt td input[type=number], table.dt.stack td input[type=number] { text-align: left; }
    .modal table.dt td.row-end, table.dt.stack td.row-end { position: absolute; top: 4px; right: 4px; padding: 0; }
    .row-del { font-size: 18px; padding: 6px 10px; }

    /* pipeline, costs */
    .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { padding: 12px; }
    .tile-num { font-size: 26px; }
    .panel { padding: 12px 12px 14px; overflow-x: auto; }
    .panel table.dt:not(.stack):not(.upcoming) { min-width: 520px; }
    .panel h3 { flex-wrap: wrap; gap: 2px 12px; }
    .panel table.dt.stack td.num { text-align: left; }
    table.dt.upcoming, table.dt.upcoming tbody { display: block; }
    table.dt.upcoming tr { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid #f1f3f4; }
    table.dt.upcoming td { display: block; width: auto !important; border: none; padding: 0; }
    table.dt.upcoming td:nth-child(3) { order: 5; flex: 1 1 100%; }
    table.dt.upcoming td.num { text-align: left; }
    table.dt.stack tr .mini-btn { margin: 4px 6px 0 0; }
    .mini-actions select { font-size: 14px; padding: 7px 6px; }
    .mini-btn { padding: 7px 11px; font-size: 12px; }

    /* calendar: colored bars on the grid, tap a day for the list */
    .cal-head { gap: 8px; }
    .cal-head h2 { font-size: 18px; min-width: 0; margin: 0 4px; flex: 1; }
    .cal-key { margin-left: 0; width: 100%; flex-wrap: wrap; gap: 6px 14px; }
    .cal-btn { padding: 9px 14px; }
    .cal-dow { padding: 5px 2px; text-align: center; font-size: 9.5px; letter-spacing: 0; }
    .cal-day { min-height: 58px; padding: 3px; }
    .cal-num { font-size: 11px; }
    .chip-ev { height: 5px; padding: 0; font-size: 0; border-left: none; border-radius: 3px; margin-bottom: 3px; background: var(--ink); }
    .chip-ev.ev-ship { background: var(--copper); }
    .chip-ev.ev-eta { background: var(--amber); }
    .chip-ev.done { background: #c3cbd1; }
    .chip-ev.overdue { background: var(--danger); }
    .ev-more { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Traveler</h1>
      <div class="sub">PROJECT ROUTE SHEET — every step, checked off in order</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="timer-bar" id="timerBar"></div>

  <nav class="tabs" id="tabs">
    <button data-view="projects">Projects</button>
    <button data-view="pipeline">Pipeline</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="costs">Costs &amp; Time</button>
  </nav>

  <div class="toolbar">
    <button class="btn-primary" id="addProjectBtn">+ New project</button>
    <div id="projFilters">
    <select class="filter" id="filterSelect">
      <option value="all">All projects</option>
      <option value="not-started">Not started</option>
      <option value="in-progress">In progress</option>
      <option value="blocked">Blocked</option>
      <option value="done">Done</option>
    </select>
    <select class="filter" id="typeFilterSelect">
      <option value="all">All work types</option>
    </select>
    <label class="hide-toggle">
      <input type="checkbox" id="hideCompletedToggle">
      Hide completed steps
    </label>
    <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="io-row">
    <button class="io-btn sync-btn" id="syncBtn">☁ Set up sync</button>
    <button class="io-btn" id="syncSettingsBtn">Sync settings</button>
    <button class="io-btn" id="exportBtn">Export to .json</button>
    <button class="io-btn" id="importBtn">Import from .json</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div id="content" class="loading">Loading route sheets...</div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const STORAGE_KEY = 'traveler-projects-v5';
const LEGACY_KEYS = ['traveler-projects-v4', 'traveler-projects-v3', 'traveler-projects-v2'];

// Project stages, in pipeline order. Edit this list to rename or add stages.
const STAGES = [
  { id: 'design', label: 'Design', color: '#46708a' },
  { id: 'waiting-parts', label: 'Waiting on parts', color: '#c99a3a' },
  { id: 'assembly', label: 'Assembly', color: '#7a5473' },
  { id: 'testing', label: 'Testing', color: '#bf6a35' },
  { id: 'ready', label: 'Ready to ship', color: '#3f8078' },
  { id: 'shipped', label: 'Shipped', color: '#4c7a63' }
];
const PART_STATUSES = [
  { id: 'needed', label: 'To order' },
  { id: 'ordered', label: 'Ordered' },
  { id: 'shipped', label: 'Shipped' },
  { id: 'delivered', label: 'Delivered' }
];

function uid(prefix) {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function ensureProjectFields(p) {
  if (!Array.isArray(p.steps)) p.steps = [];
  if (!STAGES.some(s => s.id === p.stage)) p.stage = 'design';
  if (typeof p.shipDate !== 'string') p.shipDate = '';
  ['parts', 'expenses', 'timeEntries'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });

  p.steps.forEach(s => {
    if (!s.id) s.id = uid('s');
    if (!s.type) s.type = 'mechanical';
    if (!Array.isArray(s.dependsOn)) s.dependsOn = [];
    if (typeof s.deadline !== 'string') s.deadline = '';
  });
  // drop dependency references to steps that no longer exist
  const validIds = new Set(p.steps.map(s => s.id));
  p.steps.forEach(s => { s.dependsOn = s.dependsOn.filter(id => validIds.has(id)); });

  p.parts.forEach(pt => {
    if (!pt.id) pt.id = uid('pt');
    if (!PART_STATUSES.some(x => x.id === pt.status)) pt.status = 'needed';
    pt.name = pt.name || 'Part';
    pt.qty = Number(pt.qty) || 0;
    pt.unitCost = Number(pt.unitCost) || 0;
    if (typeof pt.eta !== 'string') pt.eta = '';
    if (typeof pt.supplier !== 'string') pt.supplier = '';
  });
  p.expenses.forEach(ex => {
    if (!ex.id) ex.id = uid('x');
    ex.amount = Number(ex.amount) || 0;
    if (typeof ex.date !== 'string') ex.date = '';
    if (typeof ex.desc !== 'string') ex.desc = '';
  });
  p.timeEntries.forEach(te => {
    if (!te.id) te.id = uid('t');
    te.seconds = Number(te.seconds) || 0;
    if (typeof te.date !== 'string') te.date = '';
    if (typeof te.note !== 'string') te.note = '';
    if (!te.stepId) te.stepId = null;
  });
}

// ---- dates (all stored as local YYYY-MM-DD strings) ----
function dateStr(d) {
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}
function todayStr() { return dateStr(new Date()); }
function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function daysUntil(str) {
  return Math.round((parseDate(str) - parseDate(todayStr())) / 86400000);
}
function fmtNiceDate(str) {
  if (!str) return '';
  return parseDate(str).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

// ---- formatting ----
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec === 0) return '0m';
  if (sec < 60) return '<1m';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}
function money(n) {
  return '$' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ---- stages and cost/time rollups ----
function getStage(id) { return STAGES.find(s => s.id === id) || STAGES[0]; }
function partLine(pt) { return (pt.qty || 0) * (pt.unitCost || 0); }
function partsPlanned(p) { return p.parts.reduce((a, pt) => a + partLine(pt), 0); }
function partsOrdered(p) { return p.parts.filter(pt => pt.status !== 'needed').reduce((a, pt) => a + partLine(pt), 0); }
function expensesTotal(p) { return p.expenses.reduce((a, ex) => a + (ex.amount || 0), 0); }
function projectTotal(p) { return partsPlanned(p) + expensesTotal(p); }
function projectSpent(p) { return partsOrdered(p) + expensesTotal(p); }
function projectSeconds(p) { return p.timeEntries.reduce((a, te) => a + (te.seconds || 0), 0); }
function stepSeconds(p, stepId) { return p.timeEntries.filter(te => te.stepId === stepId).reduce((a, te) => a + te.seconds, 0); }
function partsOutstanding(p) { return p.parts.filter(pt => pt.status !== 'delivered'); }

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

// Default work types. More can be added from the UI; colors are assigned
// from PALETTE in order, so new types keep the same visual language.
const DEFAULT_TYPES = [
  { id: 'mechanical', label: 'Mechanical', color: '#5b6b7a' },
  { id: 'software', label: 'Software', color: '#bf6a35' },
  { id: 'validation', label: 'Validation', color: '#4c7a63' }
];
const PALETTE = ['#5b6b7a', '#bf6a35', '#4c7a63', '#c99a3a', '#46708a', '#7a5473', '#3f8078', '#a4463a', '#8a6d3f', '#5f7a46'];

let projects = [];
let types = [];
let filter = 'all';
let typeFilter = 'all';
let hideCompleted = false;
let seq = 1;
let lastType = 'mechanical';
let draggedProjectId = null;
let activeTimer = null;          // { projectId, stepId, start }
let currentView = 'projects';
const _now = new Date();
let calYear = _now.getFullYear();
let calMonth = _now.getMonth();
let modalProjectId = null;

// ---- sync state ----
// Everything below is saved with the data so unsynced edits survive a reload.
const SYNC_CFG_KEY = 'traveler-sync-settings';   // per device: Web app URL + secret (never exported)
let syncCfg = { url: '', secret: '' };
let sync = { rev: 0, dirty: {}, tombstones: [], metaDirty: false, lastSyncAt: 0 };
let metaUpdatedAt = 0;
let snapshots = new Map();       // project id -> JSON string (without updatedAt), to detect edits
let stamps = new Map();          // project id -> last updatedAt we know of
let metaSnapshot = '';
let syncing = false;
let syncAgain = false;
let syncTimer = null;
let syncStatus = { state: 'off', message: '' };   // off | ok | syncing | offline | error
let pendingRender = false;

const contentEl = document.getElementById('content');
const statsEl = document.getElementById('stats');
const toastEl = document.getElementById('toast');
const legendEl = document.getElementById('legend');
const typeFilterSelect = document.getElementById('typeFilterSelect');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function getType(id) {
  return types.find(t => t.id === id) || types[0] || DEFAULT_TYPES[0];
}

function slugify(label) {
  let base = label.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  if (!base) base = 'type';
  let slug = base, i = 2;
  while (types.some(t => t.id === slug)) { slug = `${base}-${i++}`; }
  return slug;
}

function readSaved(key) {
  const raw = localStorage.getItem(key);
  return raw ? JSON.parse(raw) : null;
}

function loadData() {
  try {
    let parsed = readSaved(STORAGE_KEY);
    let migrated = false;
    if (!parsed) {
      // fall back to older storage versions so existing work carries forward
      for (const key of LEGACY_KEYS) {
        parsed = readSaved(key);
        if (parsed) { migrated = true; break; }
      }
    }
    if (parsed) {
      projects = Array.isArray(parsed.projects) ? parsed.projects : [];
      seq = parsed.seq || (projects.length + 1);
      types = (parsed.types && parsed.types.length) ? parsed.types : DEFAULT_TYPES.slice();
      activeTimer = parsed.activeTimer || null;
      if (parsed.sync) {
        sync = Object.assign({ rev: 0, dirty: {}, tombstones: [], metaDirty: false, lastSyncAt: 0 }, parsed.sync);
        metaUpdatedAt = Number(parsed.metaUpdatedAt) || 0;
      }
    } else {
      types = DEFAULT_TYPES.slice();
    }
    projects.forEach(ensureProjectFields);
    // Data saved before sync existed: stamp it so the first connect uploads everything.
    const stamp = Date.now();
    projects.forEach(p => {
      if (!p.updatedAt) { p.updatedAt = stamp; sync.dirty[p.id] = true; }
    });
    if (projects.length && !metaUpdatedAt) { metaUpdatedAt = stamp; sync.metaDirty = true; }
    if (activeTimer && !projects.some(p => p.id === activeTimer.projectId)) activeTimer = null;
    lastType = types[0].id;
    rebuildSnapshots();
    if (migrated) persist();
  } catch (e) {
    projects = [];
    types = DEFAULT_TYPES.slice();
    rebuildSnapshots();
    showToast('Could not read saved data — starting fresh');
  }
  loadSyncSettings();
  renderLegendAndFilter();
  render();
  renderSyncButton();
  if (syncConfigured()) syncNow();
}

// ---- saving and change tracking ----
function projectSnap(p) {
  return JSON.stringify(p, (k, v) => (k === 'updatedAt' ? undefined : v));
}

function currentMeta() {
  return { updatedAt: metaUpdatedAt, types, seq, order: projects.map(p => p.id) };
}

function metaSnap() {
  return JSON.stringify({ types, seq, order: projects.map(p => p.id) });
}

function rebuildSnapshots() {
  snapshots = new Map(projects.map(p => [p.id, projectSnap(p)]));
  stamps = new Map(projects.map(p => [p.id, p.updatedAt || 0]));
  metaSnapshot = metaSnap();
}

// Compare against the last known state; stamp whatever changed so sync knows what to send.
// updatedAt only ever moves forward, even if this device's clock is behind another's.
function trackChanges() {
  const now = Date.now();
  const liveIds = new Set(projects.map(p => p.id));
  projects.forEach(p => {
    const snap = projectSnap(p);
    if (snapshots.get(p.id) !== snap) {
      p.updatedAt = Math.max(now, (p.updatedAt || 0) + 1);
      snapshots.set(p.id, snap);
      stamps.set(p.id, p.updatedAt);
      sync.dirty[p.id] = true;
    }
  });
  [...snapshots.keys()].forEach(id => {
    if (liveIds.has(id)) return;
    const stamp = Math.max(now, (stamps.get(id) || 0) + 1);
    snapshots.delete(id);
    stamps.delete(id);
    delete sync.dirty[id];
    sync.tombstones = sync.tombstones.filter(t => t.id !== id);
    sync.tombstones.push({ id, updatedAt: stamp });
  });
  const ms = metaSnap();
  if (ms !== metaSnapshot) {
    metaSnapshot = ms;
    metaUpdatedAt = Math.max(now, metaUpdatedAt + 1);
    sync.metaDirty = true;
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, seq, types, activeTimer, sync, metaUpdatedAt }));
  } catch (e) {
    showToast('Save failed — your browser may be blocking local storage');
  }
}

function saveData() {
  trackChanges();
  persist();
  renderSyncButton();
  scheduleSync();
}

function renderLegendAndFilter() {
  legendEl.innerHTML = types.map(t =>
    `<span><span class="dot" style="background:${t.color}"></span>${escapeHtml(t.label)}</span>`
  ).join('') + `<button class="add-type-btn" id="addTypeBtn">+ Type</button>`;
  document.getElementById('addTypeBtn').addEventListener('click', addType);

  const current = typeFilterSelect.value;
  typeFilterSelect.innerHTML = '<option value="all">All work types</option>' +
    types.map(t => `<option value="${t.id}">${escapeHtml(t.label)}</option>`).join('');
  typeFilterSelect.value = types.some(t => t.id === current) ? current : 'all';
  typeFilter = typeFilterSelect.value;
}

function addType() {
  const label = prompt('New work type (e.g. Electrical):');
  if (!label || !label.trim()) return;
  const id = slugify(label.trim());
  const color = PALETTE[types.length % PALETTE.length];
  types.push({ id, label: label.trim(), color });
  lastType = id;
  saveData();
  renderLegendAndFilter();
  render();
}

function computeStatus(p) {
  const total = p.steps.length;
  const done = p.steps.filter(s => s.done).length;
  if (p.blocked) return 'blocked';
  if (total === 0) return 'not-started';
  if (done === total) return 'done';
  if (done === 0) return 'not-started';
  return 'in-progress';
}

function findStep(p, id) {
  return p.steps.find(s => s.id === id);
}

function isLocked(p, step) {
  return step.dependsOn.some(depId => {
    const dep = findStep(p, depId);
    return dep && !dep.done;
  });
}

function unmetPrecedents(p, step) {
  return step.dependsOn
    .map(id => findStep(p, id))
    .filter(dep => dep && !dep.done);
}

// Would adding "fromId depends on candidateId" create a cycle?
// True if candidateId already (transitively) depends on fromId.
function wouldCreateCycle(p, fromId, candidateId, visited = new Set()) {
  if (fromId === candidateId) return true;
  if (visited.has(candidateId)) return false;
  visited.add(candidateId);
  const candidate = findStep(p, candidateId);
  if (!candidate) return false;
  if (candidate.dependsOn.includes(fromId)) return true;
  return candidate.dependsOn.some(depId => wouldCreateCycle(p, fromId, depId, visited));
}

function closeDepPopover() {
  const existing = document.getElementById('depPopover');
  if (existing) existing.remove();
  document.removeEventListener('mousedown', outsideDepClick, true);
}

function outsideDepClick(e) {
  const pop = document.getElementById('depPopover');
  if (pop && !pop.contains(e.target)) closeDepPopover();
}

function openDepPopover(anchorEl, p, step) {
  closeDepPopover();
  const others = p.steps.filter(s => s.id !== step.id);
  const pop = document.createElement('div');
  pop.className = 'dep-popover';
  pop.id = 'depPopover';

  if (others.length === 0) {
    pop.innerHTML = `<div class="dep-title">Depends on</div><div class="dep-empty">No other steps in this project yet.</div>`;
  } else {
    pop.innerHTML = `<div class="dep-title">Depends on</div>` + others.map(o => `
      <label>
        <input type="checkbox" data-id="${o.id}" ${step.dependsOn.includes(o.id) ? 'checked' : ''}>
        <span>${escapeHtml(o.text)}</span>
      </label>
    `).join('');
  }
  const closeBtn = document.createElement('button');
  closeBtn.className = 'dep-close';
  closeBtn.textContent = 'Done';
  closeBtn.addEventListener('click', closeDepPopover);
  pop.appendChild(closeBtn);

  pop.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const targetId = cb.dataset.id;
      if (cb.checked) {
        if (wouldCreateCycle(p, step.id, targetId)) {
          cb.checked = false;
          alert("Can't add that — it would create a circular dependency.");
          return;
        }
        step.dependsOn.push(targetId);
      } else {
        step.dependsOn = step.dependsOn.filter(id => id !== targetId);
      }
      saveData();
      render();
    });
  });

  document.body.appendChild(pop);
  const rect = anchorEl.getBoundingClientRect();
  pop.style.top = `${window.scrollY + rect.bottom + 4}px`;
  pop.style.left = `${window.scrollX + rect.left}px`;
  setTimeout(() => document.addEventListener('mousedown', outsideDepClick, true), 0);
}

function statusLabel(s) {
  return { 'not-started': 'Not started', 'in-progress': 'In progress', 'blocked': 'Blocked', 'done': 'Done' }[s];
}

function renderStats() {
  const total = projects.length;
  const done = projects.filter(p => computeStatus(p) === 'done').length;
  const stepsRemaining = projects.reduce((acc, p) => acc + p.steps.filter(s => !s.done).length, 0);
  const partsOpen = projects.reduce((acc, p) => acc + partsOutstanding(p).length, 0);
  const totalCost = projects.reduce((acc, p) => acc + projectTotal(p), 0);
  statsEl.innerHTML = `
    <div><span class="num">${total}</span>projects</div>
    <div><span class="num">${done}</span>done</div>
    <div><span class="num">${stepsRemaining}</span>steps left</div>
    <div><span class="num">${partsOpen}</span>parts open</div>
    <div><span class="num">${money(totalCost)}</span>total cost</div>
  `;
}

function renderTabs() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
}

function render() {
  renderStats();
  renderTimerBar();
  renderTabs();
  document.getElementById('projFilters').classList.toggle('hidden', currentView !== 'projects');

  if (projects.length === 0) {
    contentEl.className = '';
    contentEl.innerHTML = `<div class="empty-state">
      <h2>No projects on the bench yet</h2>
      <p>Start a route sheet for whatever you're building — SpeedNode, the AOI rig, planter test stand, anything.</p>
    </div>`;
    return;
  }

  contentEl.className = '';
  if (currentView === 'pipeline') renderPipelineView();
  else if (currentView === 'calendar') renderCalendarView();
  else if (currentView === 'costs') renderCostsView();
  else renderProjectsView();
}

function renderProjectsView() {
  const visible = projects.filter(p => {
    const statusOk = filter === 'all' || computeStatus(p) === filter;
    const typeOk = typeFilter === 'all' || p.steps.some(s => s.type === typeFilter);
    const hasRemaining = p.steps.length === 0 || p.steps.some(s => !s.done);
    const hideOk = !hideCompleted || hasRemaining;
    return statusOk && typeOk && hideOk;
  });

  if (projects.length === 0) {
    contentEl.className = '';
    contentEl.innerHTML = `<div class="empty-state">
      <h2>No projects on the bench yet</h2>
      <p>Start a route sheet for whatever you're building — SpeedNode, the AOI rig, planter test stand, anything.</p>
    </div>`;
    return;
  }

  if (visible.length === 0) {
    contentEl.className = '';
    const allDoneMsg = hideCompleted && filter === 'all' && typeFilter === 'all' && projects.length > 0
      ? 'Everything is done — nice work.'
      : 'Nothing matches that filter';
    contentEl.innerHTML = `<div class="empty-state"><h2>${allDoneMsg}</h2></div>`;
    return;
  }

  contentEl.className = 'grid';
  contentEl.innerHTML = '';
  visible.forEach(p => contentEl.appendChild(renderCard(p)));
}

function renderCard(p) {
  const status = computeStatus(p);
  let displaySteps = typeFilter === 'all' ? p.steps : p.steps.filter(s => s.type === typeFilter);
  if (hideCompleted) displaySteps = displaySteps.filter(s => !s.done);
  const total = displaySteps.length;

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.projectId = p.id;

  card.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (draggedProjectId && draggedProjectId !== p.id) card.classList.add('drop-target');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drop-target'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drop-target');
    if (!draggedProjectId || draggedProjectId === p.id) return;
    const fromIdx = projects.findIndex(x => x.id === draggedProjectId);
    if (fromIdx === -1) return;
    const [moved] = projects.splice(fromIdx, 1);
    const toIdx = projects.findIndex(x => x.id === p.id);
    projects.splice(toIdx, 0, moved);
    saveData(); render();
  });

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <button class="top-btn" title="Move this project to the top">⤒ Top</button>
    <span class="drag-handle" title="Drag to reorder" draggable="true">⠿</span>
    <span class="tag-id">TR-${String(p.num).padStart(3,'0')}</span>
    <div class="card-title" contenteditable="true" spellcheck="false">${escapeHtml(p.name)}</div>
    <div class="card-notes" contenteditable="true" spellcheck="false">${escapeHtml(p.notes || '')}</div>
    <div class="status-row">
      <span class="status-pill status-${status}" title="Double-click to toggle blocked">${statusLabel(status)}</span>
      <button class="del-btn" title="Delete project">✕</button>
    </div>
  `;
  const titleEl = head.querySelector('.card-title');
  titleEl.addEventListener('blur', () => { p.name = titleEl.textContent.trim() || 'Untitled'; saveData(); });
  const notesEl = head.querySelector('.card-notes');
  notesEl.addEventListener('blur', () => { p.notes = notesEl.textContent.trim(); saveData(); });
  head.querySelector('.del-btn').addEventListener('click', () => {
    if (confirm(`Delete "${p.name}"? This can't be undone.`)) {
      if (activeTimer && activeTimer.projectId === p.id) activeTimer = null;
      projects = projects.filter(x => x.id !== p.id);
      saveData(); render();
    }
  });
  head.querySelector('.status-pill').addEventListener('dblclick', () => {
    p.blocked = !p.blocked;
    saveData(); render();
  });
  head.querySelector('.top-btn').addEventListener('click', () => {
    const i = projects.findIndex(x => x.id === p.id);
    if (i > 0) { projects.unshift(projects.splice(i, 1)[0]); saveData(); render(); }
  });
  const handle = head.querySelector('.drag-handle');
  handle.addEventListener('dragstart', (e) => {
    draggedProjectId = p.id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', p.id);
  });
  handle.addEventListener('dragend', () => {
    draggedProjectId = null;
    card.classList.remove('dragging');
    document.querySelectorAll('.card.drop-target').forEach(c => c.classList.remove('drop-target'));
  });
  card.appendChild(head);
  card.appendChild(renderMetaRow(p));

  const pads = document.createElement('div');
  pads.className = 'pads';
  const padCount = Math.max(total, 1);
  for (let i = 0; i < padCount; i++) {
    const pad = document.createElement('div');
    if (i < total) {
      const s = displaySteps[i];
      const origIdx = p.steps.indexOf(s);
      const t = getType(s.type);
      const locked = isLocked(p, s);
      pad.className = 'pad' + (locked ? ' locked' : '');
      if (s.done) { pad.style.background = t.color; pad.style.borderColor = t.color; }
      pad.title = locked
        ? `[${t.label}] ${s.text} — locked, waiting on: ${unmetPrecedents(p, s).map(d => d.text).join(', ')}`
        : `[${t.label}] ${s.text}`;
      pad.addEventListener('click', () => {
        if (isLocked(p, p.steps[origIdx])) {
          showToast('Locked — finish its prerequisite steps first');
          return;
        }
        p.steps[origIdx].done = !p.steps[origIdx].done;
        saveData(); render();
      });
    } else {
      pad.className = 'pad empty-slot';
    }
    pads.appendChild(pad);
  }
  card.appendChild(pads);

  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps';
  displaySteps.forEach(s => {
    const origIdx = p.steps.indexOf(s);
    const t = getType(s.type);
    const locked = isLocked(p, s);
    const unmet = locked ? unmetPrecedents(p, s) : [];
    const running = !!(activeTimer && activeTimer.stepId === s.id);
    const logged = stepSeconds(p, s.id);
    const row = document.createElement('div');
    row.className = 'step-row';
    const typeOptions = types.map(tt => `<option value="${tt.id}" ${tt.id===s.type?'selected':''}>${escapeHtml(tt.label)}</option>`).join('');
    row.innerHTML = `
      <div class="step-check ${s.done ? 'checked' : ''} ${locked ? 'locked' : ''}" style="${s.done ? `background:${t.color};border-color:${t.color}` : ''}" title="${locked ? 'Locked — finish prerequisite steps first' : ''}"></div>
      <div class="step-body">
        <div class="step-toprow">
          <select class="type-select" style="background:${hexToRgba(t.color, 0.15)};color:${t.color}">${typeOptions}</select>
          <div class="step-text ${s.done ? 'done' : ''}" contenteditable="true" spellcheck="false">${escapeHtml(s.text)}</div>
          <button class="dep-btn ${s.dependsOn.length ? 'has-deps' : ''}" title="Set which steps must finish first">Depends on${s.dependsOn.length ? ' (' + s.dependsOn.length + ')' : ''}</button>
          <button class="step-del">✕</button>
        </div>
        ${locked ? `<div class="lock-hint">Waiting on: ${unmet.map(d => escapeHtml(d.text)).join(', ')}</div>` : ''}
        <div class="step-meta">
          <button class="timer-btn ${running ? 'running' : ''}">${running ? '■ Stop' : '▶ Start'}</button>
          <span class="step-time ${running ? 'live' : ''}" data-base="${logged}" title="Time logged on this step — click to open the time log">${fmtDuration(logged)}</span>
          <label class="due-field ${dueClass(s)}">Due <input type="date" value="${escapeAttr(s.deadline)}"></label>
        </div>
      </div>
    `;
    row.querySelector('.step-check').addEventListener('click', () => {
      if (isLocked(p, p.steps[origIdx])) {
        showToast('Locked — finish its prerequisite steps first');
        return;
      }
      p.steps[origIdx].done = !p.steps[origIdx].done; saveData(); render();
    });
    const typeSel = row.querySelector('.type-select');
    typeSel.addEventListener('change', () => {
      p.steps[origIdx].type = typeSel.value;
      lastType = typeSel.value;
      saveData(); render();
    });
    const textEl = row.querySelector('.step-text');
    textEl.addEventListener('blur', () => {
      p.steps[origIdx].text = textEl.textContent.trim() || p.steps[origIdx].text;
      saveData();
    });
    row.querySelector('.dep-btn').addEventListener('click', (e) => {
      openDepPopover(e.currentTarget, p, p.steps[origIdx]);
    });
    row.querySelector('.timer-btn').addEventListener('click', () => {
      if (activeTimer && activeTimer.stepId === s.id) stopTimer(false);
      else startTimer(p, p.steps[origIdx]);
    });
    row.querySelector('.step-time').addEventListener('click', () => openDetails(p.id, 'time'));
    row.querySelector('.due-field input').addEventListener('change', (e) => {
      p.steps[origIdx].deadline = e.target.value;
      saveData(); render();
    });
    row.querySelector('.step-del').addEventListener('click', () => {
      const deletedId = p.steps[origIdx].id;
      if (activeTimer && activeTimer.stepId === deletedId) stopTimer(true);
      // keep any logged hours, just detach them from the deleted step
      p.timeEntries.forEach(te => { if (te.stepId === deletedId) te.stepId = null; });
      p.steps.splice(origIdx, 1);
      p.steps.forEach(st => { st.dependsOn = st.dependsOn.filter(id => id !== deletedId); });
      saveData(); render();
    });
    stepsEl.appendChild(row);
  });
  card.appendChild(stepsEl);

  const addStep = document.createElement('div');
  addStep.className = 'add-step';
  const addTypeOptions = types.map(t => `<option value="${t.id}" ${t.id===lastType?'selected':''}>${escapeHtml(t.label)}</option>`).join('');
  addStep.innerHTML = `
    <select class="add-type">${addTypeOptions}</select>
    <input type="text" placeholder="Add a step...">
    <button>Add</button>
  `;
  const input = addStep.querySelector('input');
  const typeSelect = addStep.querySelector('.add-type');
  const addFn = () => {
    const val = input.value.trim();
    if (!val) return;
    lastType = typeSelect.value;
    p.steps.push({ id: uid('s'), text: val, done: false, type: lastType, dependsOn: [], deadline: '' });
    input.value = '';
    saveData(); render();
  };
  addStep.querySelector('button').addEventListener('click', addFn);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addFn(); });
  card.appendChild(addStep);

  return card;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('addProjectBtn').addEventListener('click', () => {
  const name = prompt('Project name:');
  if (!name || !name.trim()) return;
  const np = { id: uid('p'), num: seq++, name: name.trim(), notes: '', blocked: false, steps: [] };
  ensureProjectFields(np);
  projects.unshift(np);
  saveData(); render();
});

document.getElementById('filterSelect').addEventListener('change', e => {
  filter = e.target.value;
  render();
});

typeFilterSelect.addEventListener('change', e => {
  typeFilter = e.target.value;
  render();
});

document.getElementById('hideCompletedToggle').addEventListener('change', e => {
  hideCompleted = e.target.checked;
  render();
});

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  currentView = btn.dataset.view;
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const payload = { version: 5, projects, seq, types, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `traveler-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Exported');
});

const importFileInput = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFileInput.click());

importFileInput.addEventListener('change', () => {
  const file = importFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch (e) {
      alert('That file is not valid JSON — could not import it.');
      importFileInput.value = '';
      return;
    }
    if (!parsed || !Array.isArray(parsed.projects)) {
      alert("That file doesn't look like a Traveler backup — no projects found in it.");
      importFileInput.value = '';
      return;
    }
    const syncNote = syncConfigured()
      ? '\n\nSync is on, so this also replaces the data in your Google Sheet and on your other devices.'
      : '';
    const replace = confirm(
      `Import "${file.name}"?\n\nOK = replace everything currently in Traveler with this file's data.\nCancel = do nothing.${syncNote}`
    );
    importFileInput.value = '';
    if (!replace) return;

    projects = parsed.projects;
    seq = parsed.seq || (projects.length + 1);
    types = (parsed.types && parsed.types.length) ? parsed.types : DEFAULT_TYPES.slice();
    activeTimer = null;
    projects.forEach(ensureProjectFields);
    saveData();
    renderLegendAndFilter();
    render();
    showToast('Imported');
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
});

// =====================================================================
// Timer
// =====================================================================
function startTimer(p, step) {
  if (activeTimer) stopTimer(true);
  activeTimer = { projectId: p.id, stepId: step.id, start: Date.now() };
  saveData();
  render();
}

function stopTimer(silent) {
  if (!activeTimer) return;
  const p = projects.find(x => x.id === activeTimer.projectId);
  const seconds = Math.round((Date.now() - activeTimer.start) / 1000);
  if (p && seconds >= 1) {
    p.timeEntries.push({
      id: uid('t'),
      stepId: activeTimer.stepId,
      date: dateStr(new Date(activeTimer.start)),
      seconds,
      note: 'Timer'
    });
  }
  activeTimer = null;
  saveData();
  if (!silent) {
    render();
    showToast(`Logged ${fmtDuration(seconds)}`);
  }
}

function renderTimerBar() {
  const bar = document.getElementById('timerBar');
  if (!activeTimer) { bar.classList.remove('on'); bar.innerHTML = ''; return; }
  const p = projects.find(x => x.id === activeTimer.projectId);
  const s = p && findStep(p, activeTimer.stepId);
  bar.classList.add('on');
  bar.innerHTML = `<span class="pulse"></span>
    <span>Timing <strong>${escapeHtml(p ? p.name : '')}</strong> — ${escapeHtml(s ? s.text : 'step')}</span>
    <span class="clock" id="timerClock">00:00:00</span>
    <button id="timerStopBtn">Stop &amp; log</button>`;
  bar.querySelector('#timerStopBtn').addEventListener('click', () => stopTimer(false));
  tickTimer();
}

function tickTimer() {
  if (!activeTimer) return;
  const elapsed = Math.floor((Date.now() - activeTimer.start) / 1000);
  const clk = document.getElementById('timerClock');
  if (clk) clk.textContent = fmtClock(elapsed);
  document.querySelectorAll('.step-time.live').forEach(el => {
    el.textContent = fmtDuration((Number(el.dataset.base) || 0) + elapsed);
  });
}
setInterval(tickTimer, 1000);

// =====================================================================
// Project card: stage / ship date / summary chips
// =====================================================================
function dueClass(s) {
  if (!s.deadline || s.done) return '';
  const d = daysUntil(s.deadline);
  return d < 0 ? 'overdue' : d <= 2 ? 'soon' : '';
}

function shipHint(p) {
  if (!p.shipDate || p.stage === 'shipped') return '';
  const d = daysUntil(p.shipDate);
  if (d < 0) return `${-d}d late`;
  if (d === 0) return 'today';
  return `in ${d}d`;
}

function renderMetaRow(p) {
  const st = getStage(p.stage);
  const outstanding = partsOutstanding(p).length;
  const total = p.parts.length;
  const late = p.shipDate && p.stage !== 'shipped' && daysUntil(p.shipDate) < 0;
  const row = document.createElement('div');
  row.className = 'meta-row';
  row.innerHTML = `
    <select class="stage-select" style="background:${hexToRgba(st.color, 0.16)};color:${st.color}" title="Project stage">
      ${STAGES.map(s => `<option value="${s.id}" ${s.id === p.stage ? 'selected' : ''}>${escapeHtml(s.label)}</option>`).join('')}
    </select>
    <label class="meta-field ${late ? 'overdue' : ''}">Ship <input type="date" value="${escapeAttr(p.shipDate)}"><span>${shipHint(p)}</span></label>
    ${total ? `<button class="chip ${outstanding ? 'warn' : ''}" data-open="parts" title="Open parts list">${total - outstanding}/${total} parts in</button>` : ''}
    <button class="chip" data-open="expenses" title="Parts planned + expenses">${money(projectTotal(p))}</button>
    <button class="chip" data-open="time" title="Total time logged">${fmtDuration(projectSeconds(p))}</button>
    <button class="details-btn">Details</button>`;
  row.querySelector('.stage-select').addEventListener('change', e => { p.stage = e.target.value; saveData(); render(); });
  row.querySelector('input[type=date]').addEventListener('change', e => { p.shipDate = e.target.value; saveData(); render(); });
  row.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDetails(p.id, b.dataset.open)));
  row.querySelector('.details-btn').addEventListener('click', () => openDetails(p.id));
  return row;
}

function stepOptions(p, selectedId) {
  return `<option value="">General (no step)</option>` +
    p.steps.map(s => `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${escapeHtml(s.text)}</option>`).join('');
}

function openDetails(projectId, section) {
