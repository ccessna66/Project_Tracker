function refreshModalTotals() {
  const p = projects.find(x => x.id === modalProjectId);
  if (!p) return;
  const setText = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  setText('sum-parts', `${p.parts.length} part${p.parts.length === 1 ? '' : 's'} · ${money(partsPlanned(p))} planned · ${money(partsOrdered(p))} ordered`);
  setText('sum-exp', `${money(expensesTotal(p))} · project total ${money(projectTotal(p))}`);
  setText('sum-time', `${fmtDuration(projectSeconds(p))} logged`);
  p.parts.forEach(pt => {
    const el = modalRoot.querySelector(`[data-line="${pt.id}"]`);
    if (el) el.textContent = money(partLine(pt));
  });
}

// Field edits inside the details modal save quietly (no re-render, so tabbing between fields keeps focus).
modalRoot.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.field || !modalProjectId) return;
  const p = projects.find(x => x.id === modalProjectId);
  if (!p) return;
  const coll = t.dataset.coll;
  const item = coll === 'project' ? p : (p[coll] || []).find(x => x.id === t.dataset.id);
  if (!item) return;
  const field = t.dataset.field;
  if (field === 'hours') item.seconds = Math.max(0, Math.round((parseFloat(t.value) || 0) * 3600));
  else if (field === 'stepId') item.stepId = t.value || null;
  else if (t.type === 'number') item[field] = parseFloat(t.value) || 0;
  else item[field] = t.value;
  saveData();
  refreshModalTotals();
});

modalRoot.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('modal-backdrop')) { closeModal(); return; }
  const actEl = t.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (act === 'close') { closeModal(); return; }
  const p = projects.find(x => x.id === modalProjectId);
  if (!p) return;
  const row = actEl.closest('.add-row');
  const f = name => row && row.querySelector(`[data-f="${name}"]`);
  let focusSel = null;

  if (act === 'del-part') p.parts = p.parts.filter(x => x.id !== actEl.dataset.id);
  else if (act === 'del-exp') p.expenses = p.expenses.filter(x => x.id !== actEl.dataset.id);
  else if (act === 'del-time') p.timeEntries = p.timeEntries.filter(x => x.id !== actEl.dataset.id);
  else if (act === 'add-part') {
    const name = f('name').value.trim();
    if (!name) { showToast('Give the part a name'); return; }
    p.parts.push({
      id: uid('pt'), name,
      qty: parseFloat(f('qty').value) || 1,
      unitCost: parseFloat(f('unit').value) || 0,
      supplier: f('supplier').value.trim(),
      status: 'needed', eta: ''
    });
    focusSel = '[data-section="parts"] .add-row [data-f="name"]';
  } else if (act === 'add-exp') {
    const amount = parseFloat(f('amount').value);
    if (isNaN(amount)) { showToast('Enter an amount'); return; }
    p.expenses.push({ id: uid('x'), date: f('date').value || todayStr(), desc: f('desc').value.trim() || 'Expense', amount });
    focusSel = '[data-section="expenses"] .add-row [data-f="desc"]';
  } else if (act === 'add-time') {
    const seconds = Math.round((parseFloat(f('hours').value) || 0) * 3600 + (parseFloat(f('mins').value) || 0) * 60);
    if (seconds <= 0) { showToast('Enter hours and/or minutes'); return; }
    p.timeEntries.push({ id: uid('t'), stepId: f('step').value || null, date: f('date').value || todayStr(), seconds, note: f('note').value.trim() });
    focusSel = '[data-section="time"] .add-row [data-f="hours"]';
  } else {
    return;
  }
  saveData();
  renderDetailsModal(null, focusSel);
});

modalRoot.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const row = e.target.closest('.add-row');
  if (!row) return;
  const btn = row.querySelector('button[data-act]');
  if (btn) { e.preventDefault(); btn.click(); }
});

// =====================================================================
// Pipeline view: what is waiting on what
// =====================================================================
function nameCounts(items) {
  const counts = new Map();
  items.forEach(x => counts.set(x.p.name, (counts.get(x.p.name) || 0) + 1));
  return [...counts].map(([n, c]) => c > 1 ? `${escapeHtml(n)} (${c})` : escapeHtml(n)).join(', ');
}

function setPartStatus(pid, ptid, status) {
  const p = projects.find(x => x.id === pid);
  const pt = p && p.parts.find(x => x.id === ptid);
  if (!pt) return;
  pt.status = status;
  saveData();
  render();
}

function renderPipelineView() {
  contentEl.className = '';
  const allParts = [];
  projects.forEach(p => p.parts.forEach(pt => allParts.push({ p, pt })));
  const toOrder = allParts.filter(x => x.pt.status === 'needed');
  const inTransit = allParts.filter(x => x.pt.status === 'ordered' || x.pt.status === 'shipped');
  inTransit.sort((a, b) => (a.pt.eta || '9999') < (b.pt.eta || '9999') ? -1 : 1);
  const lateParts = inTransit.filter(x => x.pt.eta && daysUntil(x.pt.eta) < 0);
  const assembly = projects.filter(p => p.stage === 'assembly').map(p => ({ p }));
  const testing = projects.filter(p => p.stage === 'testing').map(p => ({ p }));
  const shipSoon = projects.filter(p => p.shipDate && p.stage !== 'shipped' && daysUntil(p.shipDate) <= 14).map(p => ({ p }));
  const lateShips = shipSoon.filter(x => daysUntil(x.p.shipDate) < 0);

  const tile = (num, label, color, names, flag) => `
    <div class="tile" style="--tile-color:${color}">
      <div class="tile-num">${num}</div>
      <div class="tile-label">${label}</div>
      ${flag ? `<div class="tile-flag">${flag}</div>` : ''}
      <div class="tile-names">${names || '<span style="color:#a3b0ba">None</span>'}</div>
    </div>`;

  const tiles = `<div class="tiles">
    ${tile(toOrder.length, 'Parts to order', '#c99a3a', nameCounts(toOrder))}
    ${tile(inTransit.length, 'Parts in transit', '#46708a', nameCounts(inTransit), lateParts.length ? `${lateParts.length} past ETA` : '')}
    ${tile(assembly.length, 'Awaiting assembly', '#7a5473', nameCounts(assembly))}
    ${tile(testing.length, 'Awaiting testing', '#bf6a35', nameCounts(testing))}
    ${tile(shipSoon.length, 'Shipping within 14 days', '#3f8078', nameCounts(shipSoon), lateShips.length ? `${lateShips.length} late` : '')}
  </div>`;

  const miniCard = p => {
    const out = partsOutstanding(p).length;
    const doneSteps = p.steps.filter(s => s.done).length;
    const late = p.shipDate && p.stage !== 'shipped' && daysUntil(p.shipDate) < 0;
    return `<div class="mini">
      <button class="link-btn mini-title" data-open="schedule" data-pid="${p.id}">TR-${String(p.num).padStart(3, '0')} · ${escapeHtml(p.name)}</button>
      <div class="mini-meta">
        <span>${doneSteps}/${p.steps.length} steps</span>
        ${p.parts.length ? `<span>${p.parts.length - out}/${p.parts.length} parts in</span>` : ''}
        ${p.shipDate ? `<span class="${late ? 'overdue-txt' : ''}">ship ${escapeHtml(fmtNiceDate(p.shipDate))}${shipHint(p) ? ' · ' + shipHint(p) : ''}</span>` : ''}
      </div>
      <div class="mini-actions">
        <select data-stage-move="${p.id}" title="Move to stage">
          ${STAGES.map(s => `<option value="${s.id}" ${s.id === p.stage ? 'selected' : ''}>${escapeHtml(s.label)}</option>`).join('')}
        </select>
      </div>
    </div>`;
  };

  const board = `<div class="board">${STAGES.map(st => {
    const list = projects.filter(p => p.stage === st.id);
    return `<div class="col" style="--col-color:${st.color}">
      <div class="col-head"><span>${escapeHtml(st.label)}</span><span>${list.length}</span></div>
      ${list.length ? list.map(miniCard).join('') : '<div class="col-empty">Nothing here</div>'}
    </div>`;
  }).join('')}</div>`;

  const projLink = p => `<button class="link-btn" data-open="parts" data-pid="${p.id}">${escapeHtml(p.name)}</button>`;

  const orderPanel = `<div class="panel">
    <h3>Parts to order <span class="sum">${toOrder.length} item${toOrder.length === 1 ? '' : 's'} · ${money(toOrder.reduce((a, x) => a + partLine(x.pt), 0))}</span></h3>
    ${toOrder.length ? `<table class="dt stack">
      <thead><tr><th>Project</th><th>Part</th><th class="num">Qty</th><th class="num">Est. cost</th><th>Supplier</th><th></th></tr></thead>
      <tbody>${toOrder.map(x => `<tr>
        <td data-label="Project">${projLink(x.p)}</td><td data-label="Part">${escapeHtml(x.pt.name)}</td>
        <td data-label="Qty" class="num">${x.pt.qty}</td><td data-label="Est. cost" class="num">${money(partLine(x.pt))}</td>
        <td data-label="Supplier">${escapeHtml(x.pt.supplier)}</td>
        <td class="num"><button class="mini-btn" data-pact="ordered" data-pid="${x.p.id}" data-ptid="${x.pt.id}">Mark ordered</button></td>
      </tr>`).join('')}</tbody>
    </table>` : `<div class="muted">Nothing waiting to be ordered.</div>`}
  </div>`;

  const transitPanel = `<div class="panel">
    <h3>Parts in transit <span class="sum">${inTransit.length} item${inTransit.length === 1 ? '' : 's'}</span></h3>
    ${inTransit.length ? `<table class="dt stack">
      <thead><tr><th>Project</th><th>Part</th><th class="num">Qty</th><th>Status</th><th>ETA</th><th></th></tr></thead>
      <tbody>${inTransit.map(x => {
        const late = x.pt.eta && daysUntil(x.pt.eta) < 0;
        return `<tr>
          <td data-label="Project">${projLink(x.p)}</td><td data-label="Part">${escapeHtml(x.pt.name)}</td>
          <td data-label="Qty" class="num">${x.pt.qty}</td>
          <td data-label="Status">${x.pt.status === 'shipped' ? 'Shipped' : 'Ordered'}</td>
          <td data-label="ETA"><input type="date" data-eta data-pid="${x.p.id}" data-ptid="${x.pt.id}" value="${escapeAttr(x.pt.eta)}">${late ? ` <span class="overdue-txt">${-daysUntil(x.pt.eta)}d late</span>` : ''}</td>
          <td class="num" style="white-space:nowrap">
            ${x.pt.status === 'ordered' ? `<button class="mini-btn" data-pact="shipped" data-pid="${x.p.id}" data-ptid="${x.pt.id}">Shipped</button> ` : ''}
            <button class="mini-btn" data-pact="delivered" data-pid="${x.p.id}" data-ptid="${x.pt.id}">Delivered</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>` : `<div class="muted">No parts on the way.</div>`}
  </div>`;

  contentEl.innerHTML = tiles + board + `<div class="two-col">${orderPanel}${transitPanel}</div>`;
}

// =====================================================================
// Calendar view: ship dates, step deadlines, part ETAs
// =====================================================================
const EV_LABEL = { ship: 'SHIP', due: 'DUE', eta: 'ETA' };
const EV_SECTION = { ship: 'schedule', due: 'schedule', eta: 'parts' };
const EV_ORDER = { ship: 0, due: 1, eta: 2 };

function eventsByDate() {
  const map = {};
  const add = (date, ev) => { if (date) (map[date] = map[date] || []).push(ev); };
  projects.forEach(p => {
    add(p.shipDate, {
      kind: 'ship', pid: p.id, text: p.name,
      done: p.stage === 'shipped', overdue: p.stage !== 'shipped' && daysUntil(p.shipDate) < 0
    });
    p.steps.forEach(s => add(s.deadline, {
      kind: 'due', pid: p.id, text: `${p.name}: ${s.text}`,
      done: s.done, overdue: !s.done && daysUntil(s.deadline) < 0
    }));
    p.parts.forEach(pt => {
      if (pt.status !== 'delivered') add(pt.eta, {
        kind: 'eta', pid: p.id, text: `${pt.name} (${p.name})`,
        done: false, overdue: daysUntil(pt.eta) < 0
      });
    });
  });
  Object.values(map).forEach(list => list.sort((a, b) => EV_ORDER[a.kind] - EV_ORDER[b.kind]));
  return map;
}

function renderCalendarView() {
  contentEl.className = '';
  const events = eventsByDate();
  const first = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + daysInMonth) / 7);
  const start = new Date(calYear, calMonth, 1 - first.getDay());
  const today = todayStr();
  const monthLabel = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  let cells = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(n => `<div class="cal-dow">${n}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = dateStr(d);
    const evs = events[ds] || [];
    const chips = evs.slice(0, 3).map(ev => `<span class="chip-ev ev-${ev.kind} ${ev.done ? 'done' : ''} ${ev.overdue ? 'overdue' : ''}"
        data-ev-pid="${ev.pid}" data-ev-section="${EV_SECTION[ev.kind]}"
        title="${escapeAttr(EV_LABEL[ev.kind] + ' · ' + ev.text)}">${EV_LABEL[ev.kind]} · ${escapeHtml(ev.text)}</span>`).join('');
    cells += `<div class="cal-day ${d.getMonth() !== calMonth ? 'other' : ''} ${ds === today ? 'today' : ''}" data-day="${ds}">
      <span class="cal-num">${d.getDate()}</span>${chips}${evs.length > 3 ? `<div class="ev-more">+${evs.length - 3} more</div>` : ''}
    </div>`;
  }

  const upcoming = [];
  Object.keys(events).forEach(ds => {
    if (daysUntil(ds) <= 30) events[ds].forEach(ev => { if (!ev.done) upcoming.push({ ds, ev }); });
  });
  upcoming.sort((a, b) => a.ds < b.ds ? -1 : a.ds > b.ds ? 1 : EV_ORDER[a.ev.kind] - EV_ORDER[b.ev.kind]);

  const upRows = upcoming.slice(0, 40).map(({ ds, ev }) => {
    const dd = daysUntil(ds);
    const when = dd < 0 ? `<span class="overdue-txt">${-dd}d overdue</span>` : dd === 0 ? 'today' : `in ${dd}d`;
    return `<tr>
      <td style="width:120px">${escapeHtml(fmtNiceDate(ds))}</td>
      <td style="width:70px"><span class="up-kind">${EV_LABEL[ev.kind]}</span></td>
      <td><button class="link-btn" data-open="${EV_SECTION[ev.kind]}" data-pid="${ev.pid}">${escapeHtml(ev.text)}</button></td>
      <td class="num" style="width:110px">${when}</td>
    </tr>`;
  }).join('');

  contentEl.innerHTML = `
    <div class="cal-head">
      <button class="cal-btn" data-cal="prev">‹</button>
      <h2>${escapeHtml(monthLabel)}</h2>
      <button class="cal-btn" data-cal="today">Today</button>
      <button class="cal-btn" data-cal="next">›</button>
      <div class="cal-key">
        <span style="--k:#bf6a35;--kbg:#f3e2d1">Ship date</span>
        <span style="--k:#223142;--kbg:#edf0f2">Step deadline</span>
        <span style="--k:#c99a3a;--kbg:#f6ecd3">Part ETA</span>
      </div>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="panel">
      <h3>Coming up <span class="sum">overdue + next 30 days · click any day above to set a date</span></h3>
      ${upcoming.length ? `<table class="dt upcoming"><tbody>${upRows}</tbody></table>` : `<div class="muted">Nothing scheduled. Click a day on the calendar, or set ship dates and step deadlines on the project cards.</div>`}
    </div>`;
}

function openDayModal(ds) {
  modalProjectId = null;
  const evs = eventsByDate()[ds] || [];
  const projOpts = projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  modalRoot.innerHTML = `
  <div class="modal-backdrop">
    <div class="modal narrow" role="dialog" aria-label="Day">
      <div class="modal-head">
        <h2>${escapeHtml(fmtNiceDate(ds))}</h2>
        <button class="modal-x" data-act="close" title="Close (Esc)">✕</button>
      </div>
      <div class="modal-body">
        <section class="modal-section">
          <h3>On this day</h3>
          ${evs.length ? `<ul class="day-events">${evs.map(ev => `<li data-day-open="${ev.pid}" data-day-section="${EV_SECTION[ev.kind]}"><strong class="up-kind">${EV_LABEL[ev.kind]}</strong> ${escapeHtml(ev.text)}${ev.done ? ' <span class="muted">(done)</span>' : ''}</li>`).join('')}</ul>` : '<div class="muted">Nothing scheduled.</div>'}
        </section>
        <section class="modal-section">
          <h3>Set a date here</h3>
          <div class="form-grid">
            <label>Set</label>
            <select id="dayWhat"><option value="ship">Project ship date</option><option value="due">Step deadline</option></select>
            <label>Project</label>
            <select id="dayProject">${projOpts}</select>
            <label id="dayStepLabel" style="display:none">Step</label>
            <select id="dayStep" style="display:none"></select>
          </div>
          <button class="modal-primary" id="daySave">Set date</button>
        </section>
      </div>
    </div>
  </div>`;

  const what = modalRoot.querySelector('#dayWhat');
  const proj = modalRoot.querySelector('#dayProject');
  const stepSel = modalRoot.querySelector('#dayStep');
  const stepLabel = modalRoot.querySelector('#dayStepLabel');
  const fillSteps = () => {
    const p = projects.find(x => x.id === proj.value);
    stepSel.innerHTML = p && p.steps.length
      ? p.steps.map(s => `<option value="${s.id}">${escapeHtml(s.text)}${s.done ? ' (done)' : ''}</option>`).join('')
      : '<option value="">No steps in this project</option>';
  };
  const sync = () => {
    const due = what.value === 'due';
    stepLabel.style.display = stepSel.style.display = due ? '' : 'none';
    if (due) fillSteps();
  };
  what.addEventListener('change', sync);
  proj.addEventListener('change', sync);

  modalRoot.querySelector('#daySave').addEventListener('click', () => {
    const p = projects.find(x => x.id === proj.value);
    if (!p) return;
    if (what.value === 'ship') {
      p.shipDate = ds;
    } else {
      const s = stepSel.value && findStep(p, stepSel.value);
      if (!s) { showToast('Pick a step (add steps on the project card first)'); return; }
      s.deadline = ds;
    }
    saveData();
    closeModal();
    showToast('Date set');
  });
  modalRoot.querySelectorAll('[data-day-open]').forEach(li => {
    li.addEventListener('click', () => openDetails(li.dataset.dayOpen, li.dataset.daySection));
  });
}

// ---- delegated handlers for the Pipeline and Calendar views ----
contentEl.addEventListener('click', e => {
  const open = e.target.closest('[data-open][data-pid]');
  if (open) { openDetails(open.dataset.pid, open.dataset.open); return; }
  const pact = e.target.closest('[data-pact]');
  if (pact) { setPartStatus(pact.dataset.pid, pact.dataset.ptid, pact.dataset.pact); return; }
  const cal = e.target.closest('[data-cal]');
  if (cal) {
    const act = cal.dataset.cal;
    if (act === 'prev') { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } }
    else if (act === 'next') { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } }
    else { const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); }
    render();
    return;
  }
  const chip = e.target.closest('[data-ev-pid]');
  if (chip) { openDetails(chip.dataset.evPid, chip.dataset.evSection); return; }
  const day = e.target.closest('[data-day]');
  if (day) openDayModal(day.dataset.day);
});

contentEl.addEventListener('change', e => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-eta')) {
    const p = projects.find(x => x.id === t.dataset.pid);
    const pt = p && p.parts.find(x => x.id === t.dataset.ptid);
    if (pt) { pt.eta = t.value; saveData(); render(); }
  } else if (t.dataset && t.dataset.stageMove) {
    const p = projects.find(x => x.id === t.dataset.stageMove);
    if (p) { p.stage = t.value; saveData(); render(); }
  }
});

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCostsCsv() {
  const lines = [['Project', 'Stage', 'Ship date', 'Steps done', 'Steps total', 'Parts planned', 'Parts ordered or later', 'Expenses', 'Total cost', 'Hours logged'].join(',')];
  projects.forEach(p => {
    lines.push([
      `TR-${String(p.num).padStart(3, '0')} ${p.name}`, getStage(p.stage).label, p.shipDate,
      p.steps.filter(s => s.done).length, p.steps.length,
      partsPlanned(p).toFixed(2), partsOrdered(p).toFixed(2), expensesTotal(p).toFixed(2),
      projectTotal(p).toFixed(2), (projectSeconds(p) / 3600).toFixed(2)
    ].map(csvCell).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `traveler-costs-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Exported CSV');
}

  contentEl.innerHTML = `
    <div class="panel">

      <table class="dt">
        <thead><tr>
          <th>Project</th><th>Stage</th><th class="num">Steps</th>
          <th class="num" title="Every listed part, qty × unit cost">Parts (planned)</th>
          <th class="num">Expenses</th><th class="num">Total</th>

          <th class="num">Time</th>
        </tr></thead>
        <tbody>${body}</tbody>

          <td class="num">${money(sum('total'))}</td><td class="num">${money(sum('spent'))}</td>

// =====================================================================
// Sync with Google Sheets (via the Apps Script web app in traveler-sync.gs)
// =====================================================================
function loadSyncSettings() {
  try {
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if (raw) syncCfg = Object.assign({ url: '', secret: '' }, JSON.parse(raw));
  } catch (e) { /* keep defaults */ }
  syncStatus = { state: syncConfigured() ? 'idle' : 'off', message: '' };
}

function saveSyncSettings() {
  try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); }
  catch (e) { showToast('Could not save the sync settings on this device'); }
}

function syncConfigured() { return !!(syncCfg.url && syncCfg.secret); }
function pendingCount() { return Object.keys(sync.dirty).length + sync.tombstones.length + (sync.metaDirty ? 1 : 0); }

// Shared settings merge: types are a union, the counter takes the larger value,
// and the order comes from whichever side changed most recently.
function normMeta(m) {
  return { updatedAt: Number(m.updatedAt) || 0, types: m.types || [], seq: Number(m.seq) || 0, order: m.order || [] };
}
function mergeMeta(a, b) {
  const bNewer = (Number(b.updatedAt) || 0) > (Number(a.updatedAt) || 0);
  const newer = bNewer ? b : a;
  const older = bNewer ? a : b;
  const seen = new Set();
  const merged = [];
  (newer.types || []).concat(older.types || []).forEach(t => {
    if (!seen.has(t.id)) { seen.add(t.id); merged.push(t); }
  });
  return { updatedAt: Number(newer.updatedAt) || 0, types: merged, seq: Math.max(Number(a.seq) || 0, Number(b.seq) || 0), order: newer.order || [] };
}
function sameMeta(a, b) { return JSON.stringify(normMeta(a)) === JSON.stringify(normMeta(b)); }

async function callBackend(body) {
  const payload = JSON.stringify(body);
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 30000);
  let res;
  try {
    // A plain-text POST avoids a CORS preflight, which Apps Script cannot answer.
    res = await fetch(syncCfg.url, { method: 'POST', body: payload, signal: ctrl.signal, redirect: 'follow' });
  } catch (e) {
    const err = new Error(navigator.onLine === false ? 'No connection — changes are saved on this device and will sync later.' : 'Could not reach the sync service. Check your connection and the Web app URL.');
    err.offline = true;
    throw err;
  } finally {
    clearTimeout(timeout);
  }
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch (e) { throw new Error('The sync service sent an unexpected reply. Check the Web app URL, and that "Who has access" is set to Anyone.'); }
  if (!json.ok) throw new Error(json.error || 'Sync failed.');
  return json;
}

function scheduleSync() {
  if (!syncConfigured() || !pendingCount()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), 1500);
}

function markAllDirty() {
  projects.forEach(p => { sync.dirty[p.id] = true; });
  sync.metaDirty = true;
}

async function syncNow(manual) {
  if (!syncConfigured()) return null;
  if (syncing) { syncAgain = true; return null; }
  syncing = true;
  clearTimeout(syncTimer);
  syncStatus = { state: 'syncing', message: '' };
  renderSyncButton();
  try {
    const push = [];
    const sent = {};
    Object.keys(sync.dirty).forEach(id => {
      const p = projects.find(x => x.id === id);
      if (!p) { delete sync.dirty[id]; return; }
      push.push({ id, updatedAt: p.updatedAt, deleted: false, data: p });
      sent[id] = p.updatedAt;
    });
    const sentTombs = sync.tombstones.slice();
    sentTombs.forEach(t => push.push({ id: t.id, updatedAt: t.updatedAt, deleted: true }));
    const sentMeta = sync.metaDirty ? metaUpdatedAt : null;

    const resp = await callBackend({
      secret: syncCfg.secret, since: sync.rev, projects: push,
      meta: sync.metaDirty ? currentMeta() : null
    });

    // The sheet was emptied or replaced since we last synced: start over and send everything.
    if (resp.rev < sync.rev) {
      sync.rev = 0;
      markAllDirty();
      persist();
      syncAgain = true;
      return null;
    }

    // Clear "needs sending" only for what did not change while the request was out.
    Object.keys(sent).forEach(id => {
      const p = projects.find(x => x.id === id);
      if (!p || p.updatedAt === sent[id]) delete sync.dirty[id];
    });
    sync.tombstones = sync.tombstones.filter(t => !sentTombs.some(s => s.id === t.id && s.updatedAt === t.updatedAt));
    if (sentMeta !== null && metaUpdatedAt === sentMeta) sync.metaDirty = false;

    const changed = applyRemote(resp);
    sync.rev = resp.rev;
    sync.lastSyncAt = Date.now();
    syncStatus = { state: 'ok', message: '' };
    persist();
    renderSyncButton();
    if (changed) renderAfterRemote();
    if (manual) showToast(changed ? 'Synced — new changes pulled in' : 'Synced');
    return { changed, pushed: push.length, pulled: (resp.projects || []).length };
  } catch (err) {
    syncStatus = { state: err.offline ? 'offline' : 'error', message: err.message };
    renderSyncButton();
    if (manual) showToast(err.message);
    return null;
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}

function stateSig() {
  return JSON.stringify([projects.map(p => [p.id, p.updatedAt]), types, seq]);
}

// Merge what the sheet sent back. A project from the sheet replaces ours only if it is newer.
function applyRemote(resp) {
  const before = stateSig();
  const localMeta = currentMeta();

  (resp.projects || []).forEach(rp => {
    const idx = projects.findIndex(p => p.id === rp.id);
    const local = idx >= 0 ? projects[idx] : null;
    if (local && (local.updatedAt || 0) >= rp.updatedAt) return;       // ours is as new or newer
    if (rp.deleted) {
      if (local) {
        projects.splice(idx, 1);
        delete sync.dirty[rp.id];
        if (activeTimer && activeTimer.projectId === rp.id) activeTimer = null;
      }
      return;
    }
    const np = rp.data;
    np.updatedAt = rp.updatedAt;
    ensureProjectFields(np);
    if (local) projects[idx] = np; else projects.unshift(np);
    delete sync.dirty[rp.id];
  });

  if (resp.meta) {
    const merged = mergeMeta(localMeta, resp.meta);
    if (merged.types.length) types = merged.types;
    seq = Math.max(seq, merged.seq);
    metaUpdatedAt = merged.updatedAt;
    if (!sameMeta(merged, resp.meta)) sync.metaDirty = true;           // we know something the sheet does not
    const pos = new Map(merged.order.map((id, i) => [id, i]));
    const known = projects.filter(p => pos.has(p.id)).sort((a, b) => pos.get(a.id) - pos.get(b.id));
    projects = projects.filter(p => !pos.has(p.id)).concat(known);
  }

  // Two devices can hand out the same TR number while offline; give the later project a new one.
  const seen = new Set();
  let renumbered = false;
  [...projects].sort((a, b) => (a.id < b.id ? -1 : 1)).forEach(p => {
    if (seen.has(p.num)) {
      p.num = seq++;
      p.updatedAt = Math.max(Date.now(), (p.updatedAt || 0) + 1);
      sync.dirty[p.id] = true;
      renumbered = true;
    } else {
      seen.add(p.num);
    }
  });
  if (renumbered) { metaUpdatedAt = Math.max(Date.now(), metaUpdatedAt + 1); sync.metaDirty = true; }

  if (activeTimer && !projects.some(p => p.id === activeTimer.projectId)) activeTimer = null;
  if (!types.some(t => t.id === lastType)) lastType = types[0].id;
  rebuildSnapshots();
  return stateSig() !== before;
}

// Don't redraw the page under someone who is typing; wait until they leave the field.
function isEditing() {
  const a = document.activeElement;
  if (!a || a === document.body) return false;
  return a.isContentEditable || ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName);
}

function renderAfterRemote() {
  if (isEditing()) { pendingRender = true; return; }
  doRemoteRender();
}

function doRemoteRender() {
  pendingRender = false;
  renderLegendAndFilter();
  render();
  if (modalProjectId && modalRoot.innerHTML) {
    if (projects.some(p => p.id === modalProjectId)) renderDetailsModal(null);
    else closeModal();
  }
}

document.addEventListener('focusout', () => {
  if (!pendingRender) return;
  setTimeout(() => { if (pendingRender && !isEditing()) doRemoteRender(); }, 250);
});

function renderSyncButton() {
  const btn = document.getElementById('syncBtn');
  if (!btn) return;
  btn.classList.remove('ok', 'warn', 'busy');
  if (!syncConfigured()) {
    btn.textContent = '☁ Set up sync';
    btn.title = 'Keep your data in a Google Sheet so Traveler works on your phone and other computers';
    return;
  }
  const n = pendingCount();
  const waiting = n ? ` · ${n} waiting` : '';
  if (syncStatus.state === 'syncing') {
    btn.textContent = '⟳ Syncing…';
    btn.classList.add('busy');
    btn.title = '';
  } else if (syncStatus.state === 'offline' || syncStatus.state === 'error') {
    btn.textContent = (syncStatus.state === 'offline' ? '⚠ Offline' : '⚠ Sync problem') + waiting;
    btn.classList.add('warn');
    btn.title = syncStatus.message + ' Click to try again.';
  } else if (sync.lastSyncAt) {
    const t = new Date(sync.lastSyncAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    btn.textContent = `✓ Synced ${t}${waiting}`;
    btn.classList.add('ok');
    btn.title = 'Click to sync now';
  } else {
    btn.textContent = '☁ Not synced yet' + waiting;
    btn.title = 'Click to sync now';
  }
}

// ---- settings dialog ----
const URL_PATTERN = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[^/]+\/exec$/;

function openSyncSettings() {
  modalProjectId = null;
  const connected = syncConfigured();
  modalRoot.innerHTML = `
  <div class="modal-backdrop">
    <div class="modal narrow" role="dialog" aria-label="Sync settings">
      <div class="modal-head">
        <h2>Sync settings</h2>
        <button class="modal-x" data-act="close" title="Close (Esc)">✕</button>
      </div>
      <div class="modal-body">
        <section class="modal-section">
          <p class="muted">Keeps your projects in a Google Sheet you own, so Traveler works on your phone and your other computers. The URL and secret below are stored on this device only, and are not included in exports. Setup steps are at the top of <strong>traveler-sync.gs</strong>.</p>
          <div class="form-grid">
            <label for="syncUrl">Web app URL</label>
            <input id="syncUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="${escapeAttr(syncCfg.url)}">
            <label for="syncSecret">Secret</label>
            <div class="inline-field">
              <input id="syncSecret" type="text" autocomplete="off" spellcheck="false" placeholder="Same value as SECRET in the script" value="${escapeAttr(syncCfg.secret)}">
              <button class="mini-btn" id="syncGen" type="button">Generate</button>
            </div>
          </div>
          <div id="syncMsg" class="muted sync-msg"></div>
          <div class="add-row">
            <button class="modal-primary" id="syncConnect">${connected ? 'Save &amp; sync now' : 'Connect'}</button>
            ${connected ? '<button class="mini-btn" id="syncDisconnect">Disconnect this device</button>' : ''}
          </div>
        </section>
        ${connected ? `<section class="modal-section">
          <h3>Status</h3>
          <div class="muted">${sync.lastSyncAt ? 'Last synced ' + escapeHtml(new Date(sync.lastSyncAt).toLocaleString()) : 'Not synced yet'} · ${pendingCount()} change${pendingCount() === 1 ? '' : 's'} waiting to upload.</div>
          <div class="muted" style="margin-top:8px">A running timer stays on the device where you started it. Your hours sync as soon as you stop it.</div>
        </section>` : ''}
      </div>
    </div>
  </div>`;

  const msg = modalRoot.querySelector('#syncMsg');
  const say = (text, bad) => { msg.textContent = text; msg.classList.toggle('bad', !!bad); };

  modalRoot.querySelector('#syncGen').addEventListener('click', () => {
    const bytes = new Uint8Array(24);
    crypto.getRandomValues(bytes);
    const secret = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    modalRoot.querySelector('#syncSecret').value = secret;
    const done = () => say('Secret generated. Paste the same value into SECRET at the top of the script, then deploy it.');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(secret).then(() => say('Secret generated and copied. Paste it into SECRET at the top of the script, then deploy it.'), done);
    } else {
      done();
    }
  });

  modalRoot.querySelector('#syncConnect').addEventListener('click', async () => {
    const url = modalRoot.querySelector('#syncUrl').value.trim();
    const secret = modalRoot.querySelector('#syncSecret').value.trim();
    if (!URL_PATTERN.test(url)) { say('That doesn\'t look like a Web app URL. It should start with https://script.google.com/macros/s/ and end in /exec.', true); return; }
    if (secret.length < 12) { say('Use a longer secret (at least 12 characters). "Generate" makes a good one.', true); return; }
    const previous = syncCfg;
    syncCfg = { url, secret };
    say('Checking the connection…');
    try {
      await callBackend({ secret, action: 'ping' });
    } catch (e) {
      syncCfg = previous;
      say(e.message, true);
      return;
    }
    saveSyncSettings();
    // Start from scratch against this sheet: send everything we have, and pull everything it has.
    sync.rev = 0;
    markAllDirty();
    persist();
    say('Connected. Syncing…');
    const result = await syncNow(true);
    if (result) {
      closeModal();
      showToast(`Connected — sent ${result.pushed}, received ${result.pulled}`);
    } else {
      say(syncStatus.message || 'Connected, but the first sync did not finish. It will retry automatically.', true);
    }
  });

  const disc = modalRoot.querySelector('#syncDisconnect');
  if (disc) disc.addEventListener('click', () => {
    if (!confirm('Disconnect this device from the Google Sheet? Your projects stay on this device and the sheet keeps its copy.')) return;
    syncCfg = { url: '', secret: '' };
    try { localStorage.removeItem(SYNC_CFG_KEY); } catch (e) { /* ignore */ }
    syncStatus = { state: 'off', message: '' };
    sync.rev = 0;
    persist();
    renderSyncButton();
    closeModal();
    showToast('Disconnected');
  });
}

document.getElementById('syncBtn').addEventListener('click', () => {
  if (syncConfigured()) syncNow(true); else openSyncSettings();
});
document.getElementById('syncSettingsBtn').addEventListener('click', openSyncSettings);

// Stay current without being asked: when you come back to the tab, when the network returns, and every minute.
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' || pendingCount()) syncNow();
});
window.addEventListener('online', () => syncNow());

loadData();
</script>
</body>
